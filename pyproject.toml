[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "choicegap"
version = "0.1.0"
description = "Brief-led adaptive surveys and AI-moderated UX research interviews"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["websockets>=15,<16"]

[project.scripts]
choicegap = "choicegap.server:main"

[tool.setuptools]
packages = ["choicegap"]

[tool.setuptools.data-files]
"share/choicegap/static" = ["static/index.html", "static/app.js", "static/research.js", "static/explore.js", "static/simple-study.js", "static/mechanisms.js", "static/styles.css", "static/modes.css", "static/studio.html", "static/studio.js", "static/studio.css", "static/studio-theme.css", "static/spoken-turn.js", "static/research-tools.js", "static/task-capture.js", "static/moderator-avatar.js", "static/voice-stream.js", "static/pcm-worklet.js"]
"share/choicegap/static/vendor" = ["static/vendor/three.module.min.js", "static/vendor/three.core.min.js", "static/vendor/THREE-LICENSE.txt"]

