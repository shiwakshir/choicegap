[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choicegap"
version = "0.1.0"
description = "Adaptive controlled-choice research for stated and observed sustainability preferences"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
choicegap = "choicegap.server:main"

[tool.setuptools]
packages = ["choicegap"]

