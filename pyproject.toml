[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "choicegap"
version = "0.1.0"
description = "Brief-led adaptive surveys and AI-moderated UX research interviews"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
choicegap = "choicegap.server:main"

[tool.setuptools]
packages = ["choicegap"]

[tool.setuptools.data-files]
"share/choicegap/static" = ["static/index.html", "static/app.js", "static/research.js", "static/explore.js", "static/simple-study.js", "static/mechanisms.js", "static/styles.css", "static/modes.css", "static/studio.html", "static/studio.js", "static/studio.css"]

